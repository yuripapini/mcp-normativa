# Indice tematico: materia -> sinonimi -> atti di riferimento.
# Contiene SOLO citazioni (tipo, data, numero), mai testi normativi.
# Ogni citazione viene risolta a runtime sull'API Normattiva: se non viene
# trovata, non è mostrata all'utente. Ultima revisione: 2026-11-20.
version: 1
topics:
  - id: privacy
    nome: Protezione dei dati personali
    sinonimi: [privacy, dati personali, codice privacy, trattamento dei dati, garante privacy]
    atti:
      - nome: Codice in materia di protezione dei dati personali
        citazione: "decreto legislativo 30 giugno 2003, n. 196"

  - id: procedimento-amministrativo
    nome: Procedimento amministrativo
    sinonimi: [procedimento amministrativo, accesso agli atti, accesso documentale, silenzio assenso, legge 241]
    atti:
      - nome: Nuove norme sul procedimento amministrativo
        citazione: "legge 7 agosto 1990, n. 241"

  - id: amministrazione-digitale
    nome: Amministrazione digitale
    sinonimi: [cad, codice dell amministrazione digitale, pec, firma digitale, spid, identità digitale]
    atti:
      - nome: Codice dell'amministrazione digitale
        citazione: "decreto legislativo 7 marzo 2005, n. 82"

  - id: lavoro
    nome: Diritto del lavoro
    sinonimi: [statuto dei lavoratori, licenziamento, lavoro subordinato, sindacato, diritti dei lavoratori]
    atti:
      - nome: Statuto dei lavoratori
        citazione: "legge 20 maggio 1970, n. 300"

  - id: sicurezza-lavoro
    nome: Salute e sicurezza sul lavoro
    sinonimi: [sicurezza sul lavoro, testo unico sicurezza, dvr, rspp, infortuni sul lavoro]
    atti:
      - nome: Testo unico sulla salute e sicurezza sul lavoro
        citazione: "decreto legislativo 9 aprile 2008, n. 81"

  - id: circolazione-stradale
    nome: Circolazione stradale
    sinonimi: [codice della strada, patente, multe, contravvenzioni stradali, circolazione stradale]
    atti:
      - nome: Nuovo codice della strada
        citazione: "decreto legislativo 30 aprile 1992, n. 285"

  - id: consumatori
    nome: Tutela dei consumatori
    sinonimi: [codice del consumo, consumatore, diritto di recesso, garanzia legale, pratiche commerciali scorrette]
    atti:
      - nome: Codice del consumo
        citazione: "decreto legislativo 6 settembre 2005, n. 206"

  - id: contratti-pubblici
    nome: Contratti pubblici
    sinonimi: [codice dei contratti pubblici, appalti pubblici, gare d appalto, appalti]
    atti:
      - nome: Codice dei contratti pubblici
        citazione: "decreto legislativo 31 marzo 2023, n. 36"

  - id: enti-locali
    nome: Enti locali
    sinonimi: [tuel, testo unico enti locali, comuni, consiglio comunale, sindaco]
    atti:
      - nome: Testo unico delle leggi sull'ordinamento degli enti locali
        citazione: "decreto legislativo 18 agosto 2000, n. 267"

  - id: documentazione-amministrativa
    nome: Documentazione amministrativa
    sinonimi: [autocertificazione, dichiarazione sostitutiva, documentazione amministrativa]
    atti:
      - nome: Testo unico sulla documentazione amministrativa
        citazione: "decreto del presidente della repubblica 28 dicembre 2000, n. 445"

  - id: governo
    nome: Attività di Governo
    sinonimi: [consiglio dei ministri, presidenza del consiglio, decreti legislativi delega, attività di governo]
    atti:
      - nome: Disciplina dell'attività di Governo
        citazione: "legge 23 agosto 1988, n. 400"

  - id: diritto-civile
    nome: Diritto civile
    sinonimi: [codice civile, contratti, successioni, responsabilità civile, obbligazioni]
    atti:
      - nome: Codice civile
        citazione: "regio decreto 16 marzo 1942, n. 262"
