# Blueprint Render (piano Free): un solo Web Service.
# I tool MCP girano nello stesso processo del bot (MCP_TRANSPORT=inprocess), perché
# i servizi Free non ricevono traffico dalla rete privata di Render.
# Alternativa a pagamento con server MCP separato: render-starter.yaml.
#
# Limiti del piano Free: il servizio si spegne dopo 15 minuti senza richieste e il
# primo messaggio successivo attende circa un minuto (Telegram ritenta la consegna);
# 750 ore gratuite al mese per workspace.
#
# Valori automatici: TELEGRAM_WEBHOOK_SECRET generato da Render (il bot lo normalizza
# nei caratteri ammessi da Telegram); URL pubblico da RENDER_EXTERNAL_URL.
# Da inserire in dashboard alla creazione (sync: false): TELEGRAM_BOT_TOKEN,
# ALLOWED_TELEGRAM_USER_IDS, OPENAI_API_KEY. Mai scrivere segreti in questo file.
services:
  - type: web
    name: lexbot-telegram
    runtime: python
    plan: free
    region: frankfurt
    numInstances: 1   # rate limiter in memoria: una sola istanza
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: RUNTIME_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-4.1-mini
      - key: MCP_TRANSPORT
        value: inprocess
      - key: NORMATTIVA_BASE_URL
        value: https://dati.normattiva.it
      - key: LEXIFINA_DISCOVERY_ENABLED
        value: "false"
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      # Da impostare in dashboard al primo deploy.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ALLOWED_TELEGRAM_USER_IDS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Web app (Static Site in web/): codice condiviso e URL della Static Site. Facoltative.
      - key: WEB_ACCESS_CODE
        sync: false
      - key: WEB_ALLOWED_ORIGIN
        sync: false
