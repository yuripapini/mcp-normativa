# Fonti supportate. "primaria" = citabile come riferimento ufficiale.
version: 1
sources:
  - id: normattiva-opendata
    nome: Normattiva OpenData (API ufficiale IPZS)
    ruolo: primaria
    url: https://dati.normattiva.it/
    api: https://api.normattiva.it/t/normattiva.api
    documentazione: https://dati.normattiva.it/Come-scaricare-i-dati
    licenza: CC BY 4.0
    note: Ricerca atti, dettaglio articolo, classe provvedimento (vigente/aggiornato/abrogato).

  - id: normattiva
    nome: Normattiva - il portale della legge vigente
    ruolo: primaria
    url: https://www.normattiva.it/
    note: Link ufficiali tramite ELI (/eli/id/...) e risolutore URN (/uri-res/N2Ls?urn:nir:...).

  - id: gazzetta-ufficiale
    nome: Gazzetta Ufficiale della Repubblica Italiana
    ruolo: primaria
    url: https://www.gazzettaufficiale.it/
    note: Testo ufficiale e definitivo; link ELI serie generale (/eli/id/.../sg).

  - id: lexifina
    nome: Lexifina Global law (indice di terze parti, opzionale)
    ruolo: discovery
    url: https://github.com/lexifina/italy-law
    licenza: CC BY 4.0
    note: >-
      Usato solo per individuare candidati se LEXIFINA_DISCOVERY_ENABLED=true.
      Ogni risultato è verificato su Normattiva prima di essere mostrato.
