[project]
name = "lexbot-telegram"
version = "0.1.0"
description = "Bot Telegram di ricerca sulla legislazione italiana (Normattiva OpenData + MCP)"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # caratteri tipografici italiani nei testi

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# Testi dei messaggi Telegram: righe lunghe intenzionali (nessun a capo forzato).
"app/telegram_bot.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: chiamate reali a Normattiva (escluse di default; eseguire con -m live)"]
addopts = "-m 'not live'"
